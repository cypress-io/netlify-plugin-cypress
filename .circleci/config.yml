# Every test job runs "netlify build --offline" on CircleCI, so the tests
# do not need a Netlify site, deploy, or access token.
# The plugin's default "onSuccess" step is covered by the "on-success" job,
# which serves the built site locally in place of a real deploy.

defaultCypressOrbConfig: &defaultCypressOrbConfig
  executor: 
    name: cypress/default
    node-version: '20.19.6'

# Test jobs restore the project from the workspace instead of running
# "checkout", so GitHub's SSH host key is never added and the origin
# remote is an SSH URL. When Cypress records a run for a pull request,
# it runs a git command that reaches github.com, and SSH then waits
# forever at its "continue connecting (yes/no)?" prompt until CircleCI
# kills the job. This repo is public, so read from GitHub over anonymous
# HTTPS instead, and never let git or SSH prompt.
testJobConfig: &testJobConfig
  <<: *defaultCypressOrbConfig
  environment:
    GIT_TERMINAL_PROMPT: '0'
    GIT_SSH_COMMAND: ssh -o BatchMode=yes
    GIT_CONFIG_COUNT: '2'
    GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
    GIT_CONFIG_VALUE_0: 'git@github.com:'
    GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
    GIT_CONFIG_VALUE_1: ssh://git@github.com/

version: 2.1
orbs:
  node: circleci/node@5.1.0
  cypress: cypress-io/cypress@5.0.1
jobs:
  build:
    executor:
      name: node/default
      tag: '20.19.6'
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
          override-ci-command: npm install
      - run:
          name: show package contents 📦
          command: npm pack --dry
      - run:
          name: unit tests 🧪
          command: npm run test:unit
  install_and_persist:
    <<: *defaultCypressOrbConfig
    steps:
      - cypress/install:
          # --force is needed to avoid unsupported platform issues with netlify cli dependencies on @esbuild/android-arm
          install-command: npm update -g npm && npm ci --force
      - persist_to_workspace:
          paths:
              - .cache/Cypress
              - project
          root: ~/

  release:
    executor:
      name: node/default
      tag: '20.19.6'
    environment:
      # since we do not need Cypress to publish the NPM package
      # we can skip the binary download
      CYPRESS_INSTALL_BINARY: 0
      # we also skip Puppeteer Chromium download
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
          override-ci-command: npm install
      # allow CircleCI to release beta versions
      # from pull request build jobs
      - run:
          name: Semantic release 🚀
          command: npx semantic-release
          # by tricking Circle and removing the environment variables
          environment:
            CIRCLE_PR_NUMBER:
            CIRCLE_PULL_REQUEST:
            CI_PULL_REQUEST:

  'basic test':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: BUILD_ID=$CIRCLE_BUILD_NUM npx netlify build --offline
          working_directory: tests/basic
          environment:
            DEBUG: netlify-plugin-cypress

  'recommended test':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: BUILD_ID=$CIRCLE_BUILD_NUM npx netlify build --offline
          working_directory: tests/recommended
          environment:
            DEBUG: netlify-plugin-cypress

  'recording test':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: BUILD_ID=$CIRCLE_BUILD_NUM npx netlify build --offline
          working_directory: tests/recording
          environment:
            DEBUG: netlify-plugin-cypress

  'test-twice':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: BUILD_ID=$CIRCLE_BUILD_NUM npx netlify build --offline
          working_directory: tests/test-twice
          environment:
            DEBUG: netlify-plugin-cypress

  'test-prebuild-only':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: npm run netlify:build
          working_directory: tests/test-prebuild-only
          environment:
            DEBUG: netlify-plugin-cypress

  'test-postbuild-start':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: npm run netlify:build
          working_directory: tests/test-postbuild-start
          environment:
            DEBUG: netlify-plugin-cypress

  'test-using-chromium':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: BUILD_ID=$CIRCLE_BUILD_NUM npx netlify build --offline
          working_directory: tests/use-chromium
          environment:
            DEBUG: netlify-plugin-cypress

  'test-netlify-dev':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: npm run netlify:build
          working_directory: tests/test-netlify-dev
          environment:
            DEBUG: netlify-plugin-cypress

  'html-pages':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: BUILD_ID=$CIRCLE_BUILD_NUM npx netlify build --offline
          working_directory: tests/html-pages
          environment:
            DEBUG: netlify-plugin-cypress

  routing:
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: npm run netlify:build
          working_directory: tests/routing
          environment:
            DEBUG: netlify-plugin-cypress

  config-file:
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build 🏗
          command: npm run netlify:build
          working_directory: tests/config-file
          environment:
            DEBUG: netlify-plugin-cypress

  'on-success':
    <<: *testJobConfig
    steps:
      # all dependencies were installed in previous job
      - attach_workspace:
          at: ~/
      - run:
          name: Netlify Build with onSuccess 🏗
          command: BUILD_ID=$CIRCLE_BUILD_NUM npm run netlify:build
          working_directory: tests/on-success
          environment:
            DEBUG: netlify-plugin-cypress
      - store_artifacts:
          path: tests/on-success/netlify-build.log
      - store_artifacts:
          path: tests/on-success/server.log

workflows:
  version: 2
  test_and_release:
    jobs:
      - build
      - install_and_persist
      - 'basic test':
          requires:
            - install_and_persist
      - 'html-pages':
          requires:
            - install_and_persist
      - 'recommended test':
          requires:
            - install_and_persist
      - 'recording test':
          requires:
            - install_and_persist
      - 'test-twice':
          requires:
            - install_and_persist
      - 'test-prebuild-only':
          requires:
            - install_and_persist
      - 'test-postbuild-start':
          requires:
            - install_and_persist
      - test-using-chromium:
          requires:
            - install_and_persist
      - test-netlify-dev:
          requires:
            - install_and_persist
      - routing:
          requires:
            - install_and_persist
      - config-file:
          requires:
            - install_and_persist
      - 'on-success':
          requires:
            - install_and_persist
      - release:
          context: org-npm-credentials
          # run the release job on all branches
          # since we might want to release a beta version
          requires:
            - build
            - 'basic test'
            - 'html-pages'
            - 'recommended test'
            - 'recording test'
            - 'test-twice'
            - 'test-prebuild-only'
            - 'test-postbuild-start'
            - test-using-chromium
            - test-netlify-dev
            - 'routing'
            - config-file
            - 'on-success'
