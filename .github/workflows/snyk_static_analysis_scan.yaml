name: Snyk Static Analysis Scan
# This git workflow leverages Snyk actions to perform a Static Application 
# Testing scan (SAST) on our first-party code upon Pull Requests to Master & 
# Develop branches. We use this as a control to prevent vulnerabilities 
# from being introduced into the codebase. 
#
# Pull requests from branches in this repo are scanned on "pull_request",
# which checks out the pull request's code and has access to SNYK_TOKEN.
#
# Pull requests from forks don't get secrets on "pull_request", so they
# are scanned on "pull_request_target" instead. That event checks out
# master, never the fork's code, because running a scan over untrusted
# code with access to secrets is unsafe. For fork PRs this scan reflects
# master, not the contributor's changes.
on:
  pull_request:
    branches:
      - master
  pull_request_target:
    types:
      - opened
    branches:
      - master
jobs:
  Snyk_SAST_Scan :
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: snyk/actions/setup@master
      - name: Perform Static Analysis Test
        continue-on-error: true
        run: |
          snyk code test --all-projects --detection-depth=4 --exclude=docker,Dockerfile --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
