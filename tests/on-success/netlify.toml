[build]
base = "tests/on-success"
command = "echo 'Netlify build command ...'"
publish = "public"
  [build.environment]
  # stands in for the URL Netlify sets after a real deploy,
  # test.sh reads it and serves the "public" folder at this address
  DEPLOY_PRIME_URL = "http://localhost:5050"

[[plugins]]
  # local Cypress plugin will test our site after it is "deployed"
  # in production, please use: package = "netlify-plugin-cypress"
  package = "../../"

  # run tests after deploy (the default onSuccess step)
  # and record them when CYPRESS_RECORD_KEY is set
  [plugins.inputs]
    enable = true
    record = true
